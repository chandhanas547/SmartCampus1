# Prepared proposal only. Creating/syncing this Blueprint needs owner approval.
services:
  - type: web
    name: labflow-demo
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build && npm prune --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: NPM_VERSION
        value: 11.19.0
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      # Set only after verifying the selected host's proxy behavior.
      - key: TRUST_PROXY_HOPS
        sync: false
